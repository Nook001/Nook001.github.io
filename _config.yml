title: Nook
description: Personal website and technical notes by Nook.
lang: en
url: "https://nook001.github.io"
baseurl: ""
timezone: Europe/London
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/
strict_front_matter: true
future: false
show_drafts: false
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
collections:
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
exclude:
  - README.md
  - AGENTS.md
  - docs
  - scripts
  - sources
  - templates
  - vendor
  - Gemfile
  - Gemfile.lock
  - work
  - private-drafts
  - outputs
  - VALIDATION.md
