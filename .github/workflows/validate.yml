name: Validate site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: ruby scripts/check_content.rb
      - run: bundle exec jekyll build --strict_front_matter --trace
        env:
          JEKYLL_ENV: production
      - run: python scripts/check_site.py
      - run: bundle exec ruby scripts/check_articles.rb
        env:
          JEKYLL_ENV: production
