---
layout: default
---
<article class="article">
  <header class="page-heading"><a class="eyebrow" href="{{ '/blog/' | relative_url }}">← Writing</a><h1>{{ page.title | escape }}</h1><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%d %B %Y' }}</time></header>
  {% if page.sample %}<aside class="notice">Example article for the new site. This is illustrative content, not a record of completed work.</aside>{% endif %}
  <div class="prose">{{ content }}</div>
</article>
